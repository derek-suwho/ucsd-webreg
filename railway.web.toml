[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web"
watchPatterns = [
  "/apps/web/**",
  "/packages/**",
  "/package.json",
  "/package-lock.json",
  "/Dockerfile.web",
  "/railway.web.toml"
]

[deploy]
healthcheckPath = "/api/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
